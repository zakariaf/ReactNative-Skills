# .github/workflows/ci.yml
# The merge gate: the same `npm run verify` the pre-push hook runs, on every pull request and every
# push to main. One job on Linux (the cheapest runner); the device lanes are in devices.yml.
# Every action is pinned to a full commit SHA (the comment names its release); Dependabot updates
# both together (.github/dependabot.yml). Changing this file is a gate change (Gate-Change trailer).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main are never cancelled, so every
# merged commit is verified.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The git hooks are the local reviewer; on the runner nothing commits, so they stay off.
  LEFTHOOK: '0'
  EXPO_NO_TELEMETRY: '1'

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install the locked dependencies
        run: npm ci
      - name: Run every gate (npm run verify)
        run: npm run verify
      - name: Keep the reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-reports
          path: |
            reports/
            coverage/
          if-no-files-found: ignore
          retention-days: 14
