# .maestro/storekit/02-refund-relaunch.yaml — StoreKit Tier 2 flow, run only by scripts/storekit/storekit-harness.ts
# right after testRefundAll; outside .maestro/flows/, so the normal E2E run never runs it against an unarmed build.
appId: ${APP_ID}
name: A refunded Premium is revoked by the launch re-check
tags: [storekit]
---
- launchApp
- runFlow:
    file: ../subflows/debug-setup.yaml
    env:
      QUERY: 'open=paywall'
      WAIT_FOR: 'paywall.screen'
# The launch re-check (Transaction.all) is answered only after storekitd has synced its transaction
# cache: 28 s after the arm step once (iOS 26.5), so this wait allows 60 s. Never shorten it.
- extendedWaitUntil:
    visible:
      id: 'paywall.buy-button'
    timeout: 60000
