// modules/process-start/android/build.gradle
// Mirrors expo-module-template-local 0.7.10 (the template `npx create-expo-module --local` writes).
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.processstart'
version = '1.0.0'

android {
  namespace "expo.modules.processstart"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}
